[data]
split_strategy = "lhs"
exclude_shutdown_targets = true
# split_strategy = "ratio"로 바꿀 때 사용하는 임시 비율
train_ratio = 0.7
val_ratio = 0.2
test_ratio = 0.1

[experiment]
context_length = 168
horizon = 1
models = ["xgboost", "lightgbm", "timesfm3", "chronos2", "moirai2"]
seed = 42
cv_splits = 3
target_feature_index = 0
continue_on_error = true

[tree]
# full: DOCX의 전체 108개 조합, quick: 모델별 단일 조합
search_profile = "full"
n_jobs = 1
device = "auto"

[foundation]
device = "auto"
batch_size = 16

[foundation.finetuning]
# Transformer는 K-fold 없이 train/validation holdout 1회만 사용한다.
# F0~F7 × 학습률 3개 = 사전학습 모델당 24회 학습
cv_splits = 1
scopes = ["F0", "F1", "F2", "F3", "F4", "F5", "F6", "F7"]
learning_rates = [1e-6, 1e-5, 1e-4]
effective_batch_size = 32
# GPU 메모리에 맞춰 물리 배치를 조정하되 effective_batch_size는 유지한다.
train_batch_size = 1
max_steps = 1000
validation_interval = 100
early_stopping_patience = 3
# 모든 탐색과 최종 재학습에서 같은 seed를 사용한다.
final_seed = 42

[foundation.timesfm3]
checkpoint = "google/timesfm-3.0-pytorch"

[foundation.chronos2]
checkpoint = "amazon/chronos-2"

[foundation.moirai2]
checkpoint = "Salesforce/moirai-2.0-R-small"
