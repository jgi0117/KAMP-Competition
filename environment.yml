name: kamp-competition
channels:
  - pytorch
  - nvidia
  - defaults
dependencies:
  - python=3.12
  - pytorch=2.4.1
  - pytorch-cuda=11.8
  - numpy=1.26
  - pandas=2.1
  - scipy=1.11
  - contourpy<1.4
  - matplotlib
  - seaborn
  - python-dotenv
  - python-docx
  - scikit-learn
  - joblib
  - pip
  - pip:
      # XGBoost 3.4 Windows wheels require a newer CUDA driver than this laptop.
      - xgboost==2.0.3
      - lightgbm
      - transformers<5
      - chronos-forecasting
      - timesfm[torch]
      - uni2ts
